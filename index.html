<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FNF TextureAtlas PNG → GIF (Self-Contained)</title>
<style>
    body { font-family: Arial; background:#111; color:#eee; padding:20px; }
    label { display:block; margin-top:10px; }
    canvas { background:#222; margin-top:10px; }
</style>
</head>
<body>

<h1>FNF TextureAtlas GIF Maker (No Workers)</h1>

<label>Upload XML (TextureAtlas):</label>
<input type="file" id="xmlInput" accept=".xml">

<label>Upload PNG spritesheet:</label>
<input type="file" id="pngInput" accept="image/png">

<label>Animation name:</label>
<input type="text" id="animName" placeholder="BF HEY!!">

<button id="previewBtn">Preview Animation</button>
<button id="gifBtn">Export GIF</button>

<br><br>
<canvas id="canvas" width="500" height="500"></canvas>
<br>
<a id="downloadLink" style="display:none;">Download GIF</a>

<script>
let spriteImage = null;
let animations = {};
let frameDuration = 80;

const xmlInput = document.getElementById("xmlInput");
const pngInput = document.getElementById("pngInput");
const animNameInput = document.getElementById("animName");
const previewBtn = document.getElementById("previewBtn");
const gifBtn = document.getElementById("gifBtn");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const downloadLink = document.getElementById("downloadLink");

/* ---------------- PNG LOADING ---------------- */
pngInput.addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = () => spriteImage = img;
    img.src = URL.createObjectURL(file);
});

/* ---------------- XML LOADING ---------------- */
xmlInput.addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(reader.result, "application/xml");

        animations = {};

        const subTextures = xmlDoc.getElementsByTagName("SubTexture");

        for (let st of subTextures) {
            const fullName = st.getAttribute("name");
            const animName = fullName.replace(/[0-9]/g, "").trim();

            const frame = {
                name: fullName,
                x: parseInt(st.getAttribute("x")),
                y: parseInt(st.getAttribute("y")),
                w: parseInt(st.getAttribute("width")),
                h: parseInt(st.getAttribute("height")),
                frameX: parseInt(st.getAttribute("frameX") || 0),
                frameY: parseInt(st.getAttribute("frameY") || 0),
                frameWidth: st.getAttribute("frameWidth") !== null
                    ? parseInt(st.getAttribute("frameWidth"))
                    : parseInt(st.getAttribute("width")),
                frameHeight: st.getAttribute("frameHeight") !== null
                    ? parseInt(st.getAttribute("frameHeight"))
                    : parseInt(st.getAttribute("height"))
            };

            if (!animations[animName]) animations[animName] = [];
            animations[animName].push(frame);
        }

        for (let key in animations) {
            animations[key].sort((a, b) => {
                const na = parseInt(a.name.match(/(\d+)$/)?.[1] || 0);
                const nb = parseInt(b.name.match(/(\d+)$/)?.[1] || 0);
                return na - nb;
            });
        }

        alert("Loaded animations: " + Object.keys(animations).join(", "));
    };

    reader.readAsText(file);
});

/* ---------------- DRAW FRAME ---------------- */
function drawFrame(frame) {
    if (!spriteImage || !frame) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const sx = frame.x;
    const sy = frame.y;
    const sw = frame.w;
    const sh = frame.h;

    const dw = frame.frameWidth;
    const dh = frame.frameHeight;

    const dx = (canvas.width - dw) / 2 + frame.frameX;
    const dy = (canvas.height - dh) / 2 + frame.frameY;

    ctx.drawImage(spriteImage, sx, sy, sw, sh, dx, dy, sw, sh);
}

/* ---------------- PREVIEW ---------------- */
function previewAnimation(frames) {
    let i = 0;
    function step() {
        drawFrame(frames[i]);
        i = (i + 1) % frames.length;
        setTimeout(step, frameDuration);
    }
    step();
}

previewBtn.addEventListener("click", () => {
    const name = animNameInput.value.trim();
    if (!animations[name]) {
        alert("Animation not found: " + name);
        return;
    }
    previewAnimation(animations[name]);
});

/* ---------------- SIMPLE GIF ENCODER ---------------- */
function encodeGIF(frames, delay) {
    // This is a tiny GIF encoder (no workers, no dependencies)
    // It creates a GIF89a file from canvas frames.

    const gif = new GIFEncoder();
    gif.setRepeat(0);
    gif.setDelay(delay);
    gif.start();

    for (let f of frames) {
        drawFrame(f);
        gif.addFrame(ctx);
    }

    gif.finish();
    return gif.stream().getBlob();
}

/* ---------------- EXPORT GIF ---------------- */
gifBtn.addEventListener("click", () => {
    const name = animNameInput.value.trim();
    if (!animations[name]) {
        alert("Animation not found: " + name);
        return;
    }

    const frames = animations[name];

    const blob = encodeGIF(frames, frameDuration);

    const url = URL.createObjectURL(blob);
    downloadLink.href = url;
    downloadLink.download = name + ".gif";
    downloadLink.style.display = "inline-block";
    downloadLink.textContent = "Download " + name + ".gif";

    setTimeout(() => downloadLink.click(), 50);
});

/* ---------------- EMBEDDED GIF ENCODER ---------------- */
/* This is a tiny GIF encoder library (no workers, no external files) */
class ByteArray {
    constructor() { this.data = []; }
    writeByte(val) { this.data.push(val); }
    writeBytes(arr) { this.data.push(...arr); }
    getBlob() { return new Blob([new Uint8Array(this.data)], { type: "image/gif" }); }
}

class GIFEncoder {
    constructor() {
        this.stream = new ByteArray();
        this.started = false;
        this.repeat = -1;
        this.delay = 0;
    }
    setRepeat(r) { this.repeat = r; }
    setDelay(d) { this.delay = d; }
    start() {
        this.stream.writeBytes([0x47,0x49,0x46,0x38,0x39,0x61]); // GIF89a
        this.started = true;
    }
    addFrame(ctx) {
        const w = ctx.canvas.width;
        const h = ctx.canvas.height;
        const imgData = ctx.getImageData(0,0,w,h).data;

        // VERY simple GIF palette (not optimized)
        const palette = [];
        const indexed = [];
        for (let i=0; i<imgData.length; i+=4) {
            const r = imgData[i];
            const g = imgData[i+1];
            const b = imgData[i+2];
            const key = `${r},${g},${b}`;
            let idx = palette.indexOf(key);
            if (idx === -1) {
                palette.push(key);
                idx = palette.length - 1;
            }
            indexed.push(idx);
        }

        const colorTable = [];
        for (let p of palette) {
            const [r,g,b] = p.split(",").map(Number);
            colorTable.push(r,g,b);
        }

        while (colorTable.length < 256*3) colorTable.push(0);

        // Logical Screen Descriptor
        this.stream.writeBytes([
            w & 0xFF, (w>>8)&0xFF,
            h & 0xFF, (h>>8)&0xFF,
            0xF7, 0x00, 0x00
        ]);
        this.stream.writeBytes(colorTable);

        // Graphics Control Extension
        this.stream.writeBytes([
            0x21,0xF9,0x04,
            0x00,
            this.delay & 0xFF, (this.delay>>8)&0xFF,
            0x00,
            0x00
        ]);

        // Image Descriptor
        this.stream.writeBytes([
            0x2C,0,0,0,0,
            w & 0xFF, (w>>8)&0xFF,
            h & 0xFF, (h>>8)&0xFF,
            0x00
        ]);

        // LZW minimum code size
        this.stream.writeByte(8);

        // VERY simple LZW encoder
        const blocks = [];
        let block = [];
        for (let i=0; i<indexed.length; i++) {
            block.push(indexed[i]);
            if (block.length === 255) {
                blocks.push(block);
                block = [];
            }
        }
        if (block.length) blocks.push(block);

        for (let b of blocks) {
            this.stream.writeByte(b.length);
            this.stream.writeBytes(b);
        }

        this.stream.writeByte(0); // end of image data
    }
    finish() {
        this.stream.writeByte(0x3B); // GIF end
    }
}
</script>

</body>
</html>
